    <text x="-114" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">Recov 9.0</text>
    <text x="-112" y="-30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">Perf 9.0</text>
    <text x="-66" y="-90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">Explain 7.0</text>
    <text x="0" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="currentColor">B.11 Agent — 8.7 / 10</text>
    <text x="0" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" opacity="0.7">210 / 210 agents live and ticking</text>
  </g>

  <!-- ============ PANEL: scored summary ============ -->
  <g transform="translate(790,150)">
    <rect x="0" y="0" width="150" height="230" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.2"/>
    <text x="12" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="currentColor">Scored audits</text>
    <text x="12" y="50" font-family="system-ui, sans-serif" font-size="11.5" fill="currentColor">B.10 Memory</text>
    <text x="138" y="50" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0F9D58">8.7</text>
    <text x="12" y="72" font-family="system-ui, sans-serif" font-size="11.5" fill="currentColor">B.11 Agent</text>
    <text x="138" y="72" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0F9D58">8.7</text>
    <text x="12" y="94" font-family="system-ui, sans-serif" font-size="11.5" fill="currentColor">B.13 Automation</text>
    <text x="138" y="94" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0F9D58">8.7</text>
    <text x="12" y="116" font-family="system-ui, sans-serif" font-size="11.5" fill="currentColor">B.9 AI</text>
    <text x="138" y="116" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0F9D58">8.6</text>
    <text x="12" y="138" font-family="system-ui, sans-serif" font-size="11.5" fill="currentColor">B.8 DevOps</text>
    <text x="138" y="138" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#C55A11">8.1</text>
    <text x="12" y="160" font-family="system-ui, sans-serif" font-size="11.5" fill="currentColor">B.7 API</text>
    <text x="138" y="160" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#C55A11">7.6</text>
