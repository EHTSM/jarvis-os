    <text x="114" y="-30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">Cycle 9.0</text>
    <text x="115" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">Runtime 8.5</text>
    <text x="70" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">Isolat 9.5</text>
    <text x="0" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">Collab 8.0</text>
