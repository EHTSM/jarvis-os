    <text x="12" y="216" font-family="system-ui, sans-serif" font-size="10" fill="currentColor" opacity="0.6">6 of 27 executed audits</text>
    <text x="12" y="228" font-family="system-ui, sans-serif" font-size="10" fill="currentColor" opacity="0.6">carry a formal score</text>
  </g>

  <text x="24" y="540" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" opacity="0.55">Evidence: PHASE_B7 / B9 / B10 / B11 certifications. Unscored audits are omitted rather than estimated. Red markers indicate the portfolio's two weakest dimensions.</text>
</svg>
