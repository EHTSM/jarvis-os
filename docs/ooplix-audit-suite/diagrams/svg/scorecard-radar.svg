<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="Radar charts of measured dimension scores for four certified Ooplix layers: API 7.6, DevOps 8.1, AI 8.6, Memory 8.7, Agent 8.7. The API layer's response-envelope and SDK-readiness dimensions score 5.0 and 5.5, the two lowest in the portfolio.">
  <title>Ooplix V1 — Layer Dimension Radar</title>
  <defs>
    <marker id="rtick" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <circle cx="3" cy="3" r="2" fill="currentColor"/>
    </marker>
  </defs>

  <text x="24" y="34" font-family="Georgia, serif" font-size="22" font-weight="600" fill="currentColor">Where the portfolio is strong — and the two dimensions that are not</text>
  <text x="24" y="56" font-family="system-ui, sans-serif" font-size="13" fill="currentColor" opacity="0.65">Measured dimension scores, 0–10. Only formally scored audits appear. Source: B.7, B.9, B.10, B.11.</text>

  <!-- ============ RADAR 1: API (B.7) ============ -->
  <g transform="translate(150,300)">
    <circle r="100" fill="none" stroke="currentColor" stroke-opacity="0.14"/>
    <circle r="75" fill="none" stroke="currentColor" stroke-opacity="0.14"/>
    <circle r="50" fill="none" stroke="currentColor" stroke-opacity="0.14"/>
    <circle r="25" fill="none" stroke="currentColor" stroke-opacity="0.14"/>
    <!-- 9 axes -->
    <line x1="0" y1="0" x2="0" y2="-100" stroke="currentColor" stroke-opacity="0.18"/>
    <line x1="0" y1="0" x2="64.3" y2="-76.6" stroke="currentColor" stroke-opacity="0.18"/>
    <line x1="0" y1="0" x2="98.5" y2="-17.4" stroke="currentColor" stroke-opacity="0.18"/>
    <line x1="0" y1="0" x2="86.6" y2="50" stroke="currentColor" stroke-opacity="0.18"/>
    <line x1="0" y1="0" x2="34.2" y2="94" stroke="currentColor" stroke-opacity="0.18"/>
    <line x1="0" y1="0" x2="-34.2" y2="94" stroke="currentColor" stroke-opacity="0.18"/>
    <line x1="0" y1="0" x2="-86.6" y2="50" stroke="currentColor" stroke-opacity="0.18"/>
    <line x1="0" y1="0" x2="-98.5" y2="-17.4" stroke="currentColor" stroke-opacity="0.18"/>
    <line x1="0" y1="0" x2="-64.3" y2="-76.6" stroke="currentColor" stroke-opacity="0.18"/>
    <!-- data: auth 9.5, error 9.0, valid 8.0, perf 8.0, concur 8.5, rest 7.5, resp 5.0, page 5.0, sdk 5.5 -->
    <polygon points="0,-95 57.9,-68.9 78.8,-13.9 69.3,40 29.1,79.9 -25.7,70.5 -43.3,25 -49.3,-8.7 -35.4,-42.1"
             fill="#2E75B6" fill-opacity="0.18" stroke="#2E75B6" stroke-width="2"/>
    <circle cx="-43.3" cy="25" r="4" fill="#B00020"/>
    <circle cx="-49.3" cy="-8.7" r="4" fill="#B00020"/>
    <text x="0" y="-112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">Auth 9.5</text>
    <text x="72" y="-84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">Errors 9.0</text>
    <text x="118" y="-16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">Valid 8.0</text>
    <text x="104" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">Perf 8.0</text>
    <text x="44" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">Concur 8.5</text>
    <text x="-42" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">REST 7.5</text>
    <text x="-108" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#B00020">Envelope 5.0</text>
    <text x="-120" y="-16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#B00020">Paging 5.0</text>
    <text x="-72" y="-84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">SDK 5.5</text>
    <text x="0" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="currentColor">B.7 API — 7.6 / 10</text>
    <text x="0" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#B00020">Two lowest scores in the portfolio</text>
  </g>

  <!-- ============ RADAR 2: AI (B.9) ============ -->
  <g transform="translate(400,300)">
