    <line x1="0" y1="0" x2="95.1" y2="-30.9" stroke="currentColor" stroke-opacity="0.18"/>
    <line x1="0" y1="0" x2="95.1" y2="30.9" stroke="currentColor" stroke-opacity="0.18"/>
    <line x1="0" y1="0" x2="58.8" y2="80.9" stroke="currentColor" stroke-opacity="0.18"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="currentColor" stroke-opacity="0.18"/>
    <line x1="0" y1="0" x2="-58.8" y2="80.9" stroke="currentColor" stroke-opacity="0.18"/>
