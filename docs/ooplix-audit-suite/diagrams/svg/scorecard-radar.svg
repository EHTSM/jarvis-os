    <text x="118" y="-16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">Routing 9.0</text>
    <text x="106" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">Security 9.0</text>
    <text x="42" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">Reliab 8.5</text>
    <text x="-40" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">Cost 7.0</text>
    <text x="-104" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">Perf 8.0</text>
    <text x="-116" y="-16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">Prompt 6.5</text>
    <text x="-72" y="-84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="currentColor">Flows 8.5</text>
    <text x="0" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="currentColor">B.9 AI — 8.6 / 10</text>
    <text x="0" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" opacity="0.7">0 fake successes in 20 concurrent calls</text>
  </g>

  <!-- ============ RADAR 3: Agent (B.11) ============ -->
