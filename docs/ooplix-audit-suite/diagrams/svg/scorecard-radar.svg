    <circle cx="0" cy="-95" r="4" fill="#0F9D58"/>
    <text x="0" y="-112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#0F9D58">Honesty 9.5</text>
