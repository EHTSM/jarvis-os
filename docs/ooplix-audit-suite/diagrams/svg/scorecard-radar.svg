    <circle r="50" fill="none" stroke="currentColor" stroke-opacity="0.14"/>
    <circle r="25" fill="none" stroke="currentColor" stroke-opacity="0.14"/>
    <line x1="0" y1="0" x2="0" y2="-100" stroke="currentColor" stroke-opacity="0.18"/>
    <line x1="0" y1="0" x2="64.3" y2="-76.6" stroke="currentColor" stroke-opacity="0.18"/>
    <line x1="0" y1="0" x2="98.5" y2="-17.4" stroke="currentColor" stroke-opacity="0.18"/>
    <line x1="0" y1="0" x2="86.6" y2="50" stroke="currentColor" stroke-opacity="0.18"/>
    <line x1="0" y1="0" x2="34.2" y2="94" stroke="currentColor" stroke-opacity="0.18"/>
