<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-label="Cumulative audit progress from 5 to 9 August 2026. 27 audits executed across five days, rising steeply on 9 August when 16 platform certifications completed. A dashed grey line shows the 7 planned audits which have not been executed and carry no date.">
  <title>Ooplix V1 — Cumulative Audit Progress</title>
  <defs>
    <marker id="arrowP" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="currentColor"/>
    </marker>
  </defs>

  <text x="28" y="38" font-family="Georgia, serif" font-size="22" font-weight="600" fill="currentColor">Sixteen platform certifications completed on a single day — 9 August</text>
  <text x="28" y="60" font-family="system-ui, sans-serif" font-size="12.5" fill="currentColor" opacity="0.65">Cumulative audits executed. The dashed segment is forecast only — those audits have not run and hold no evidence.</text>

  <!-- plot frame -->
  <g transform="translate(70,90)">
    <!-- y gridlines: 0,10,20,30,40 over 280px -->
    <line x1="0" y1="280" x2="820" y2="280" stroke="currentColor" stroke-opacity="0.3"/>
    <line x1="0" y1="210" x2="820" y2="210" stroke="currentColor" stroke-opacity="0.1"/>
    <line x1="0" y1="140" x2="820" y2="140" stroke="currentColor" stroke-opacity="0.1"/>
    <line x1="0" y1="70"  x2="820" y2="70"  stroke="currentColor" stroke-opacity="0.1"/>
    <line x1="0" y1="0"   x2="820" y2="0"   stroke="currentColor" stroke-opacity="0.1"/>
    <line x1="0" y1="0" x2="0" y2="280" stroke="currentColor" stroke-opacity="0.3"/>

    <text x="-10" y="284" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" opacity="0.6">0</text>
    <text x="-10" y="214" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" opacity="0.6">10</text>
    <text x="-10" y="144" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" opacity="0.6">20</text>
    <text x="-10" y="74"  text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" opacity="0.6">30</text>
    <text x="-10" y="4"   text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" opacity="0.6">40</text>
    <text x="-46" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="currentColor" opacity="0.7" transform="rotate(-90,-46,140)">Cumulative audits</text>

    <!-- x: 5,6,7,8,9 Aug then planned -->
    <text x="40"  y="302" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="currentColor">5 Aug</text>
    <text x="150" y="302" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="currentColor">6 Aug</text>
    <text x="260" y="302" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="currentColor">7 Aug</text>
    <text x="370" y="302" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="currentColor">8 Aug</text>
    <text x="480" y="302" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="currentColor">9 Aug</text>
    <text x="680" y="302" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="currentColor" opacity="0.55">B.20 – Phase C (undated)</text>

    <!-- executed area: cumulative 1,6,10,13,27 (register rows) -->
    <!-- y = 280 - n*7 -->
    <polyline points="40,273 150,238 260,210 370,189 480,91"
              fill="none" stroke="#1F4E79" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <polygon points="40,273 150,238 260,210 370,189 480,91 480,280 40,280"
             fill="#1F4E79" fill-opacity="0.08"/>

    <!-- planned dashed continuation to 34 -->
    <polyline points="480,91 600,91 760,42" fill="none" stroke="#8A96A3" stroke-width="2.5" stroke-dasharray="7 5"/>

    <!-- points -->
    <circle cx="40"  cy="273" r="4.5" fill="#1F4E79"/>
    <circle cx="150" cy="238" r="4.5" fill="#1F4E79"/>
    <circle cx="260" cy="210" r="4.5" fill="#1F4E79"/>
    <circle cx="370" cy="189" r="4.5" fill="#1F4E79"/>
    <circle cx="480" cy="91"  r="6"   fill="#1F4E79"/>
    <circle cx="760" cy="42" r="5"   fill="none" stroke="#8A96A3" stroke-width="2" stroke-dasharray="3 2"/>

    <!-- callouts -->
    <text x="40"  y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="currentColor">1</text>
    <text x="150" y="227" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="currentColor">6</text>
    <text x="260" y="199" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="currentColor">10</text>
    <text x="370" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="currentColor">13</text>
    <text x="496" y="86"  font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F4E79">27 executed</text>
    <text x="686" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#8A96A3">34 if all planned run</text>

    <!-- annotation for the jump -->
    <line x1="430" y1="150" x2="474" y2="102" stroke="currentColor" stroke-opacity="0.4" marker-end="url(#arrowP)"/>
    <text x="230" y="142" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="currentColor">B.4–B.19 platform block</text>
    <text x="230" y="158" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" opacity="0.65">16 certifications, 25 findings, all against the live product</text>
  </g>

  <!-- legend -->
  <g transform="translate(70,432)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#1F4E79" stroke-width="3"/>
    <text x="38" y="4" font-family="system-ui, sans-serif" font-size="12" fill="currentColor">Executed — evidenced by committed certification or commit</text>
    <line x1="440" y1="0" x2="470" y2="0" stroke="#8A96A3" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="478" y="4" font-family="system-ui, sans-serif" font-size="12" fill="currentColor" opacity="0.7">Planned — no evidence, no date, no score</text>
  </g>

  <text x="28" y="488" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" opacity="0.55">The 9 August step is genuine: B.4–B.19 were executed as one continuous platform-certification block against a running instance, each producing its own document.</text>
  <text x="28" y="506" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" opacity="0.55">Source: git history on security/reality-completion and the 16 committed PHASE_B*.md certifications.</text>
</svg>
